name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式
        uses: actions/checkout@v4
      - name: 設定 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 Functions 套件
        run: npm install --prefix functions
      - name: 建立 Firebase 部署憑證
        shell: bash
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCHOOL_QFM }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: 部署網站、規則與 Functions
        run: npx firebase-tools@latest deploy --project school-qfm --only functions,firestore:rules,hosting --non-interactive
