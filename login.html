<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#185a87" /><title>登入｜115 八導 公佈網</title>
    <link rel="manifest" href="manifest.webmanifest" /><link rel="apple-touch-icon" href="assets/11508.jpeg" /><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="app-overrides.css" /><link rel="stylesheet" href="login-overrides.css" />
  </head>
  <body class="login-body">
    <main class="login-main"><section class="login-card">
      <img class="login-logo" src="assets/11508.jpeg" alt="115 八導 公佈網吉祥物" />
      <p class="eyebrow">115 八導 · CLASS HUB</p><h1>115 八導 公佈網</h1><p class="login-intro">請先登入後使用公告、投票與表單功能。</p>
      <form id="login-form"><label>班級代碼<input id="user-code" inputmode="numeric" autocomplete="username" pattern="80[1-9]|81[0-2]" placeholder="800" maxlength="3" required /></label><label id="pin-label" hidden>6 位數驗證碼<input id="user-pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="\d{6}" minlength="6" maxlength="6" /></label><label id="confirm-label" hidden>再次輸入驗證碼<input id="user-pin-confirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="\d{6}" minlength="6" maxlength="6" /></label><button id="login-button">下一步</button></form>
      <p id="login-note" class="field-note">首次登入可自行設定驗證碼</p><p id="login-error" class="error" role="alert"></p>
      <button id="install-app" class="install-button" type="button">▣ 安裝為桌面 App</button><p id="install-help" class="field-note" hidden></p>
    </section></main>
    <script type="module" src="login.js"></script>
  </body>
</html>
