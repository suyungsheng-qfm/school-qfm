<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" /><script>if (!localStorage.getItem("classHubAccess")) location.replace("login.html");</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><meta name="theme-color" content="#185a87" />
    <title>115 八導 公佈網</title><link rel="manifest" href="manifest.webmanifest" /><link rel="icon" href="assets/11508.jpeg" type="image/jpeg" /><link rel="stylesheet" href="styles.css" /><link rel="stylesheet" href="app-overrides.css" /><link rel="stylesheet" href="calendar-overrides.css" /><link rel="stylesheet" href="calendar-nav.css" /><link rel="stylesheet" href="school-calendar.css" />

  <body class="app-body">
    <header class="site-header"><a class="brand" href="index.html"><img src="assets/11508.jpeg" alt="" class="brand-logo" /><span>八導 公佈網<small>GRADE 8 HUB</small></span></a><div class="header-tools"><span id="user-session" class="user-session">已登入</span><a id="admin-entry" class="admin-entry" href="admin.html" hidden>級導師管理</a><button id="sign-out-user" class="sign-out-user">登出</button></div></header>
    <main>
      <section id="calendar" class="feature-page is-active" aria-labelledby="calendar-title">
        <div class="calendar-toolbar"><button id="calendar-prev" class="calendar-arrow" aria-label="上個月">‹</button><div><p class="eyebrow">GRADE 8 SCHEDULE</p><h1 id="calendar-title"></h1></div><button id="calendar-next" class="calendar-arrow" aria-label="下個月">›</button></div>

      <section id="announcements" class="feature-page" aria-labelledby="announcement-title"><div class="section-heading"><div><p class="eyebrow">NOTICE BOARD</p><h2 id="announcement-title">年級公告</h2></div><button id="refresh-announcements" class="text-button">重新整理</button></div><div id="announcements-list" class="card-grid" aria-live="polite"></div></section>

      <section id="forms" class="feature-page" aria-labelledby="form-title"><div class="section-heading"><div><p class="eyebrow">REGISTRATION</p><h2 id="form-title">資料登記</h2></div></div><div id="forms-list" class="card-grid" aria-live="polite"></div></section>
      <section id="lottery" class="feature-page" aria-labelledby="lottery-title"><div class="section-heading"><div><p class="eyebrow">CLASS DRAW</p><h2 id="lottery-title">班級抽籤</h2></div></div><div id="lottery-list" class="card-grid" aria-live="polite"></div></section>

    <nav class="mobile-nav" aria-label="主要功能"><a href="#calendar" data-page="calendar" class="is-selected"><span>▦</span>行事曆</a><a href="#announcements" data-page="announcements"><span>▣</span>公告</a><a href="#polls" data-page="polls"><span>●</span>投票</a><a href="#forms" data-page="forms"><span>✎</span>登記</a><a href="#lottery" data-page="lottery"><span>✦</span>抽籤</a></nav>
